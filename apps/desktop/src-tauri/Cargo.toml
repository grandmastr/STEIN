[package]
name = "stein-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[lib]
name = "stein_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "stein-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
stein-ipc = { path = "../../../crates/stein-ipc" }
stein-broker-windows = { path = "../../../crates/stein-broker-windows" }
stein-core = { path = "../../../crates/stein-core" }
stein-platform-windows = { path = "../../../crates/stein-platform-windows" }
stein-protocol = { path = "../../../crates/stein-protocol" }
tauri = { version = "2", features = [] }
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
zeroize = "1.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Notifications",
    "Win32_UI_Shell",
] }
windows-core = "0.61"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Threading",
] }
