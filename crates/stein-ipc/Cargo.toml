[package]
name = "stein-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Non-production compatibility path for the retained Phase 1 transport harness.
# Production private admission must come from the OS-authenticated broker.
private-client-test-harness = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
stein-core = { path = "../stein-core" }
stein-protocol = { path = "../stein-protocol" }
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v5"] }

[target.'cfg(windows)'.dependencies]
stein-broker-windows = { path = "../stein-broker-windows" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
