[workspace]
resolver = "2"
members = [
    "crates/stein-core",
    "crates/stein-ipc",
    "crates/stein-protocol",
    "crates/stein-model-openai",
    "crates/stein-platform-windows",
    "crates/stein-broker-windows",
    "crates/stein-store-sqlite",
    "apps/core-cli",
    "apps/core-daemon",
    "apps/desktop/src-tauri",
    "apps/private-broker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros", "serde"] }
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-util"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["serde", "v5", "v7"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
